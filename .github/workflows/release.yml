name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Build release artifact
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modelwire-webui/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Build WebUI
        working-directory: modelwire-webui
        run: |
          npm ci
          npm run build

      - name: Build server
        run: cargo build --release --locked --package modelwire-server

      - name: Package release archive
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package_dir="dist/modelwire-${version}-linux-x86_64"
          mkdir -p "${package_dir}/modelwire-webui"
          cp target/release/modelwire-server "${package_dir}/modelwire"
          cp README.md LICENSE modelwire.toml.example "${package_dir}/"
          cp -r docs "${package_dir}/docs"
          cp -r modelwire-webui/dist "${package_dir}/modelwire-webui/dist"
          tar -C dist -czf "dist/modelwire-${version}-linux-x86_64.tar.gz" "modelwire-${version}-linux-x86_64"
          sha256sum "dist/modelwire-${version}-linux-x86_64.tar.gz" > "dist/modelwire-${version}-linux-x86_64.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/modelwire-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/modelwire-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
